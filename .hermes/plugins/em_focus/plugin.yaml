name: em_focus
version: 0.4.0
description: Project-local tools for LLM-driven MATLAB focusing and constrained array-geometry design
kind: standalone
provides_tools:
  - em_focus_ping
  - get_focus_task_state
  - create_focus_task
  - run_focus_simulation
  - evaluate_focus
  - refine_focus
  - create_array_design_task
  - evaluate_array_geometry
  - search_array_geometry
  - save_array_design
  - create_metasurface_design_task
  - evaluate_metasurface_baseline
  - optimize_metasurface_candidate
  - evaluate_metasurface_design
  - save_metasurface_design
  - build_metasurface_cst_model
